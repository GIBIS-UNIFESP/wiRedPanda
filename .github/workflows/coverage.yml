name: Coverage

on:
  push:
    branches:
      - master

jobs:
  Ubuntu-Qt6_9_3-Code_Coverage:
    permissions:
      contents: read
    runs-on: ubuntu-24.04

    env:
      CCACHE_SLOPPINESS: pch_defines,time_macros,include_file_ctime,include_file_mtime

    steps:
    - uses: actions/checkout@v7.0.1
      with:
        submodules: recursive
        fetch-depth: 0

    - name: Work around flaky packages.microsoft.com apt mirror
      if: runner.os == 'Linux'
      run: sudo rm -f /etc/apt/sources.list.d/azure-cli.list /etc/apt/sources.list.d/microsoft-prod.list

    - name: Install Qt
      uses: jurplel/install-qt-action@48d3ad6db93f3627c8ee7a0454bc6f3744f7e730 # v4.3.1
      with:
        version: 6.9.3
        cache: true
        aqtversion: ==3.*
        modules: qtmultimedia qtimageformats

    - name: ccache
      uses: hendrikmuhs/ccache-action@f09c25b45002a07be2955cbe52e8cee55643f89d # main
      with:
        key: coverage-${{ runner.os }}

    - name: Build
      run: |
        cmake --preset coverage
        cmake --build --preset coverage

    - name: Test
      timeout-minutes: 10
      run: |
        ctest --preset coverage -V -LE gui

    # Same headless environment that runs green in build.yml; also lifts
    # coverage of the MainWindow/dialog/BeWavedDolphin UI paths that only
    # these four classes exercise.
    - name: Test (GUI, headless)
      timeout-minutes: 10
      run: |
        ctest --preset coverage -V -L gui -FS non_gui_complete

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.12'
        cache: 'pip'
        cache-dependency-path: 'MCP/Client/requirements.txt'

    - name: Install MCP client dependencies
      run: pip install -r MCP/Client/requirements.txt

    # lcov (unlike raw gcov) honors LCOV_EXCL_LINE/LCOV_EXCL_START/LCOV_EXCL_STOP markers,
    # dropping genuinely-unreachable lines from both the numerator and denominator before
    # Codecov ever sees them — passing raw .gcov files straight to codecov-action does not.
    # Same tool Scripts/coverage.sh already uses for the local report (unlike the gcovr this
    # replaces), so local and CI numbers no longer come from two different coverage engines.
    - name: Install lcov
      run: sudo apt-get update && sudo apt-get install -y lcov

    # Exercise the MCP/Server C++ paths through the Python integration suite,
    # driving the coverage-instrumented binary so its subprocess .gcda files
    # are written (the server exits cleanly on stdin EOF). Must run before the
    # coverage report is generated.
    - name: MCP Integration Test (instrumented)
      timeout-minutes: 10
      env:
        QT_QPA_PLATFORM: offscreen
        WIREDPANDA_EXE: ${{ github.workspace }}/build-coverage/wiredpanda
      run: python3 MCP/Client/run_tests.py

    # gcovr's default filter (with no --filter given) was --root itself, so it silently
    # dropped anything outside the checkout -- Qt SDK headers, /usr/include's libstdc++, etc.
    # -- with no extra config. lcov has no such default (it reports on every file any .gcda
    # references, wherever it lives), so replicate the same scope explicitly here. Everything
    # else -- moc_*/qrc_*/*_autogen, Tests/**, MCP/Server/** -- is left alone: codecov.yml's
    # own ignore:/component_management: already handle those the same way regardless of which
    # tool produced the report (Tests/**/MCP/Server/** must stay in, unlike
    # Scripts/coverage.sh's local-only report, since Codecov tracks them as their own
    # components).
    - name: Generate coverage report
      run: |
        lcov --capture --directory build-coverage --output-file build-coverage/coverage.info --ignore-errors source,inconsistent
        lcov --remove build-coverage/coverage.info \
            '/usr/*' \
            '*/Qt*/' \
            --output-file build-coverage/coverage_filtered.info --ignore-errors inconsistent,unused

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        files: build-coverage/coverage_filtered.info
        fail_ci_if_error: true
        verbose: true

    - name: Upload build artifacts on failure
      if: failure()
      uses: actions/upload-artifact@v7
      with:
        name: coverage-build-logs
        path: |
          build-coverage/CMakeCache.txt
          build-coverage/CMakeFiles/CMakeOutput.log
          build-coverage/CMakeFiles/CMakeError.log
        retention-days: 7
