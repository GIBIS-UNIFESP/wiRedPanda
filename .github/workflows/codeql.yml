name: "CodeQL"

on:
  push:
    branches:
      - master
    paths-ignore:
      - Examples/**
      - Resources/Translations/**
      - Tests/BackwardCompatibility/**
      - Tests/Fuzz/regressions/**
      - "**/*.md"
  pull_request:
    branches:
      - master
    paths-ignore:
      - Examples/**
      - Resources/Translations/**
      - Tests/BackwardCompatibility/**
      - Tests/Fuzz/regressions/**
      - "**/*.md"
  schedule:
    # Weekly run picks up newly-published queries against the current tree.
    - cron: '0 6 * * 1'

concurrency:
  group: codeql-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - language: cpp
            build-mode: manual
            config: ./.github/codeql/codeql-config-cpp.yml
          - language: python
            build-mode: none
            config: ./.github/codeql/codeql-config-python.yml
          - language: actions
            build-mode: none
            config: ./.github/codeql/codeql-config-actions.yml

    env:
      CCACHE_SLOPPINESS: pch_defines,time_macros,include_file_ctime,include_file_mtime

    steps:
    - name: Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Initialize CodeQL
      uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
      with:
        languages: ${{ matrix.language }}
        build-mode: ${{ matrix.build-mode }}
        config-file: ${{ matrix.config }}

    - name: Work around flaky packages.microsoft.com apt mirror
      if: runner.os == 'Linux' && matrix.language == 'cpp'
      run: sudo rm -f /etc/apt/sources.list.d/azure-cli.list /etc/apt/sources.list.d/microsoft-prod.list

    - name: Install Qt
      if: matrix.language == 'cpp'
      uses: jurplel/install-qt-action@a9c63c7c123f3069cff414e7e482d95dfa9d8125 # v4.4.1
      with:
        version: 6.12.0
        cache: true
        # aqtinstall's master, for Qt 6.12 on Windows x64 (see build.yml)
        aqtsource: git+https://github.com/miurahr/aqtinstall.git@076e1659807d0b362a3ed684d54c2e9c775eb9c7
        modules: qtmultimedia qtimageformats

    - name: ccache
      if: matrix.language == 'cpp'
      uses: hendrikmuhs/ccache-action@f09c25b45002a07be2955cbe52e8cee55643f89d # v1.2.24
      with:
        key: codeql-${{ runner.os }}

    - name: Build
      if: matrix.language == 'cpp'
      run: |
        # Unity builds batch multiple .cpp files into generated wrapper translation
        # units via #include — CodeQL traces whatever the build actually compiles, so
        # without this it extracts facts from those generated wrappers instead of the
        # real source files, firing cpp/include-non-header false positives on every
        # batch (paths-ignore does not apply to files compiled under build-mode:
        # manual). Build each source file as its own translation unit instead.
        cmake --preset release -DENABLE_UNITY=OFF -DENABLE_PCH=OFF
        cmake --build --preset release

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
      with:
        category: "/language:${{ matrix.language }}"

    - name: Upload build artifacts on failure
      if: failure() && matrix.language == 'cpp'
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: codeql-build-logs
        path: |
          build-release/CMakeCache.txt
          build-release/CMakeFiles/CMakeOutput.log
          build-release/CMakeFiles/CMakeError.log
        retention-days: 7

  experimental:
    name: Analyze (cpp experimental)
    # Experimental queries are lower-precision and can be noisy; run only on
    # schedule so they surface drift without gating PRs.
    if: github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
      security-events: write

    env:
      CCACHE_SLOPPINESS: pch_defines,time_macros,include_file_ctime,include_file_mtime

    steps:
    - name: Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Initialize CodeQL
      uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
      with:
        languages: cpp
        build-mode: manual
        config-file: ./.github/codeql/codeql-config-cpp-experimental.yml

    - name: Work around flaky packages.microsoft.com apt mirror
      if: runner.os == 'Linux'
      run: sudo rm -f /etc/apt/sources.list.d/azure-cli.list /etc/apt/sources.list.d/microsoft-prod.list

    - name: Install Qt
      uses: jurplel/install-qt-action@a9c63c7c123f3069cff414e7e482d95dfa9d8125 # v4.4.1
      with:
        version: 6.12.0
        cache: true
        # aqtinstall's master, for Qt 6.12 on Windows x64 (see build.yml)
        aqtsource: git+https://github.com/miurahr/aqtinstall.git@076e1659807d0b362a3ed684d54c2e9c775eb9c7
        modules: qtmultimedia qtimageformats

    - name: ccache
      uses: hendrikmuhs/ccache-action@f09c25b45002a07be2955cbe52e8cee55643f89d # v1.2.24
      with:
        key: codeql-experimental-${{ runner.os }}

    - name: Build
      run: |
        # See the analyze job's Build step: Unity/PCH must stay off so CodeQL traces
        # the real source files instead of generated Unity-batch wrapper files.
        cmake --preset release -DENABLE_UNITY=OFF -DENABLE_PCH=OFF
        cmake --build --preset release

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
      with:
        category: "/language:cpp-experimental"
