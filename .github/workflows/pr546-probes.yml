# Probes for the PR #546 review. Each job tests one or more claims the review could
# not test locally (see .claude/PR546_review.md, register IDs in brackets).
# Manual trigger only. Nothing here changes the PR.
name: PR 546 probes

on:
  push:
    branches: [probe/pr546-verification]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  flatpak:
    name: Flatpak [O1 O2 B2 build]
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /usr/local/share/boost && df -h /
      - name: Install flatpak tooling
        run: |
          sudo apt-get update && sudo apt-get install -y flatpak flatpak-builder
          # Ubuntu 24.04 blocks unprivileged user namespaces through AppArmor; bubblewrap needs them.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
      - name: Probe
        run: bash .github/probes/flatpak.sh
      - name: Wayland app_id probe
        if: always()
        run: bash .github/probes/wayland.sh
      - name: Results
        if: always()
        run: cat probe-out/results.md >> "$GITHUB_STEP_SUMMARY" || true
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: probe-flatpak
          path: probe-out/

  homebrew:
    name: Homebrew [O4 B2 B3 B1]
    runs-on: macos-26
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Probe
        run: bash .github/probes/brew.sh
      - name: Results
        if: always()
        run: cat probe-out/results.md >> "$GITHUB_STEP_SUMMARY" || true
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: probe-homebrew
          path: probe-out/

  macos-floor-build:
    name: Build with deployment target 12.0 [B1]
    runs-on: macos-26
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Probe
        run: bash .github/probes/macos-floor-build.sh
      - name: Results
        if: always()
        run: cat probe-out/results.md >> "$GITHUB_STEP_SUMMARY" || true
      - name: Upload build
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: floor-12
          path: probe-out/build-12.zip
          if-no-files-found: warn

  macos-run:
    name: Launch on macOS ${{ matrix.os }} [B1]
    needs: macos-floor-build
    if: always()
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, macos-15, macos-26]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - name: Download 12.0-target build
        continue-on-error: true
        uses: actions/download-artifact@v8.0.2
        with:
          name: floor-12
          path: floor
      - name: Probe
        run: bash .github/probes/macos-run.sh
      - name: Results
        if: always()
        run: cat probe-out/results.md >> "$GITHUB_STEP_SUMMARY" || true
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: probe-run-${{ matrix.os }}
          path: probe-out/

  nix-linux:
    name: Nix on Linux [O3 N4]
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: cachix/install-nix-action@3dc140bfc76c49fbd4dd958429132e3746bcb086 # v31.11.5
      - name: Probe
        run: bash .github/probes/nix.sh
      - name: Results
        if: always()
        run: cat probe-out/results.md >> "$GITHUB_STEP_SUMMARY" || true
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: probe-nix-linux
          path: probe-out/

  nix-darwin:
    name: Nix on macOS [O3 C21]
    runs-on: macos-26
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: cachix/install-nix-action@3dc140bfc76c49fbd4dd958429132e3746bcb086 # v31.11.5
      - name: Probe
        run: bash .github/probes/nix.sh
      - name: Results
        if: always()
        run: cat probe-out/results.md >> "$GITHUB_STEP_SUMMARY" || true
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: probe-nix-darwin
          path: probe-out/

  aur:
    name: AUR path in Arch [N5 N6 C22]
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Probe
        run: bash .github/probes/aur.sh
      - name: Results
        if: always()
        run: cat probe-out/results.md >> "$GITHUB_STEP_SUMMARY" || true
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: probe-aur
          path: probe-out/
